spring:
  cloud:
    gateway:
      routes:
        - id: msg
          uri: http://127.0.0.1:8081
          predicates:
          - Path=/messages/**
          filters:
          - name: TokenRelay
            args:
              name: messaging-client

logging:
  level:
    org.springframework:
      cloud.gateway: DEBUG
      http.server.reactive: DEBUG
      web.reactive: DEBUG
      security: DEBUG
